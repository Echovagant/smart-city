# 一次跑通后端 pytest + 前端 vitest + eslint + 前端构建。
#
# 仓库根的 verify.ps1 / verify.sh 已经封装了「跑两套测试并传播失败退出码」，
# 这里直接复用，只额外补上 lint 与 build 两步。
#
# 注意：本仓库目前**没有配置任何 git remote**，所以这个工作流要等仓库
# 推送到 GitHub 之后才会真正运行。
#
# 两个 verify 脚本都要求解释器落在 backend-python/.venv 里
# （verify.ps1 找 .venv\Scripts\python.exe，verify.sh 找 .venv/bin/python），
# 而 .venv 不在 git 里（backend-python/.gitignore）。所以装依赖之前必须先把
# venv 建出来、并把依赖装进这个 venv —— 否则两个 job 都会在「跑两套测试」
# 这一步直接以退出码 1 结束。

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: verify (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装后端依赖
        working-directory: backend-python
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 安装前端依赖
        working-directory: Data-driven-modeling
        run: npm ci

      - name: 跑两套测试（verify.ps1）
        shell: pwsh
        run: .\verify.ps1

      - name: 前端 lint
        working-directory: Data-driven-modeling
        run: npm run lint

      # 类型检查是**门禁**：类型错误不会让 npm run build 失败
      # （Vite 用 esbuild 转译，不查类型），所以必须是独立且阻塞的一步。
      - name: 前端类型检查
        working-directory: Data-driven-modeling
        run: npm run typecheck

      - name: 前端构建
        working-directory: Data-driven-modeling
        run: npm run build

      - name: 确认 Cesium 静态资源进了产物
        working-directory: Data-driven-modeling
        run: |
          $count = (Get-ChildItem dist\Cesium -Recurse -File | Where-Object { $_.Name -ne 'pruned-manifest.json' } | Measure-Object).Count
          Write-Host "dist/Cesium files: $count"
          if ($count -ne 98) { throw "dist/Cesium 文件数应为 98，实际 $count" }

      # 剪枝清单与实际产物必须一致。
      # 清单是入库的（Data-driven-modeling/cesium-runtime-manifest.json），
      # Cesium 升级或应用功能变了都可能让它过期 —— 这一步是那个哨兵。
      - name: 确认剪枝清单与产物一致
        run: node scripts/check-cesium-runtime-manifest.mjs

      # 验收度量：覆盖率 + API 延迟 + 产物体积，一次跑完并打印对照验收线的表格。
      #
      # continue-on-error：这两步是「先看得见」，不是「变成红灯」。
      # 度量脚本本身恒定返回 0（未达标的项在输出里逐条列出），
      # 这里再兜一层底，是为了让覆盖率工具万一在某个平台上炸掉时也不阻塞 CI。
      - name: 验收度量（报告，不阻塞）
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $PWD.Path
          New-Item -ItemType Directory -Force -Path "$root\.acceptance" | Out-Null
          $env:COVERAGE_FILE = "$root\.acceptance\.coverage-backend"
          $backendJson = "$root\.acceptance\backend-coverage.json"
          $backendHtml = "$root\.acceptance\backend-htmlcov"
          Push-Location backend-python
          .\.venv\Scripts\python.exe -m pytest -q --cov=main --cov=data_processor --cov-report=term-missing --cov-report="json:$backendJson" --cov-report="html:$backendHtml"
          Pop-Location
          Push-Location Data-driven-modeling
          $env:COVERAGE_DIR = "$root\.acceptance\frontend-coverage"
          npm run test:coverage
          Pop-Location
          & "$root\backend-python\.venv\Scripts\python.exe" "$root\scripts\measure-acceptance.py"

  ubuntu:
    name: verify (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装后端依赖
        working-directory: backend-python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 安装前端依赖
        working-directory: Data-driven-modeling
        run: npm ci

      - name: 跑两套测试（verify.sh）
        # 用 bash 跑：verify.sh 用了 `set -o pipefail`（bash 扩展），
        # 而 Ubuntu 上 /bin/sh 是 dash，不支持这个选项。
        run: bash verify.sh

      - name: 前端 lint
        working-directory: Data-driven-modeling
        run: npm run lint

      # 类型检查是**门禁**：类型错误不会让 npm run build 失败
      # （Vite 用 esbuild 转译，不查类型），所以必须是独立且阻塞的一步。
      - name: 前端类型检查
        working-directory: Data-driven-modeling
        run: npm run typecheck

      - name: 前端构建
        working-directory: Data-driven-modeling
        run: npm run build

      - name: 确认 Cesium 静态资源进了产物
        working-directory: Data-driven-modeling
        run: |
          count=$(find dist/Cesium -type f ! -name pruned-manifest.json | wc -l)
          echo "dist/Cesium files: $count"
          if [ "$count" -ne 98 ]; then echo "dist/Cesium 文件数应为 98，实际 $count"; exit 1; fi

      # 剪枝清单与实际产物必须一致。
      # 清单是入库的（Data-driven-modeling/cesium-runtime-manifest.json），
      # Cesium 升级或应用功能变了都可能让它过期 —— 这一步是那个哨兵。
      - name: 确认剪枝清单与产物一致
        run: node scripts/check-cesium-runtime-manifest.mjs

      # 浏览器端度量：首屏（LCP / load）+ 3D 渲染帧率。
      #
      # 只在 ubuntu job 上跑：GitHub 的 ubuntu runner 预装了 Google Chrome，
      # windows runner 还得另装一套。
      #
      # 跑 1 轮而不是 3 轮，是为了压住 CI 时长——**这里的数字不能和本机的数字
      # 直接比较**（runner 的 CPU 与网络都不同，headless Chrome 还是软件渲染），
      # 所以这一步的定位是「证明度量脚本在干净环境里能跑通」，
      # 权威数字来自本地 `node scripts/measure-browser-performance.mjs`（默认 3 轮）。
      #
      # continue-on-error 与下面的验收度量保持一致：先看得见，不变成红灯。
      - name: 浏览器端度量（报告，不阻塞）
        continue-on-error: true
        run: |
          node scripts/measure-browser-performance.mjs --runs 1 --sample-seconds 2

      # 验收度量：覆盖率 + API 延迟 + 产物体积，一次跑完并打印对照验收线的表格。
      #
      # continue-on-error：这两步是「先看得见」，不是「变成红灯」。
      # 度量脚本本身恒定返回 0（未达标的项在输出里逐条列出），
      # 这里再兜一层底，是为了让覆盖率工具万一在某个平台上炸掉时也不阻塞 CI。
      - name: 验收度量（报告，不阻塞）
        continue-on-error: true
        run: |
          set -u
          ROOT="$PWD"
          mkdir -p .acceptance
          export COVERAGE_FILE="$ROOT/.acceptance/.coverage-backend"
          ( cd backend-python && .venv/bin/python -m pytest -q --cov=main --cov=data_processor --cov-report=term-missing --cov-report="json:$ROOT/.acceptance/backend-coverage.json" --cov-report="html:$ROOT/.acceptance/backend-htmlcov" )
          ( cd Data-driven-modeling && COVERAGE_DIR="$ROOT/.acceptance/frontend-coverage" npm run test:coverage )
          backend-python/.venv/bin/python scripts/measure-acceptance.py
