# 一次跑通后端 pytest + 前端 vitest + eslint + 前端构建。
#
# 仓库根的 verify.ps1 / verify.sh 已经封装了「跑两套测试并传播失败退出码」，
# 这里直接复用，只额外补上 lint 与 build 两步。
#
# 注意：本仓库目前**没有配置任何 git remote**，所以这个工作流要等仓库
# 推送到 GitHub 之后才会真正运行。
#
# 两个 verify 脚本都要求解释器落在 backend-python/.venv 里
# （verify.ps1 找 .venv\Scripts\python.exe，verify.sh 找 .venv/bin/python），
# 而 .venv 不在 git 里（backend-python/.gitignore）。所以装依赖之前必须先把
# venv 建出来、并把依赖装进这个 venv —— 否则两个 job 都会在「跑两套测试」
# 这一步直接以退出码 1 结束。

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: verify (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装后端依赖
        working-directory: backend-python
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt -r requirements-dev.txt

      - name: 安装前端依赖
        working-directory: Data-driven-modeling
        run: npm ci --registry=https://registry.npmmirror.com

      - name: 跑两套测试（verify.ps1）
        shell: pwsh
        run: .\verify.ps1

      - name: 前端 lint
        working-directory: Data-driven-modeling
        run: npm run lint

      - name: 前端构建
        working-directory: Data-driven-modeling
        run: npm run build

      - name: 确认 Cesium 静态资源进了产物
        working-directory: Data-driven-modeling
        run: |
          $count = (Get-ChildItem dist\Cesium -Recurse -File | Measure-Object).Count
          Write-Host "dist/Cesium files: $count"
          if ($count -ne 380) { throw "dist/Cesium 文件数应为 380，实际 $count" }

      # 验收度量：覆盖率 + API 延迟 + 产物体积，一次跑完并打印对照验收线的表格。
      #
      # continue-on-error：这一轮是「先看得见」，不是「变成红灯」。
      # 度量脚本本身恒定返回 0（未达标的项在输出里逐条列出），
      # 这里再兜一层底，是为了让覆盖率工具万一在某个平台上炸掉时也不阻塞 CI。
      - name: 验收度量（报告，不阻塞）
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $PWD.Path
          New-Item -ItemType Directory -Force -Path "$root\.acceptance" | Out-Null
          $env:COVERAGE_FILE = "$root\.acceptance\.coverage-backend"
          $backendJson = "$root\.acceptance\backend-coverage.json"
          $backendHtml = "$root\.acceptance\backend-htmlcov"
          Push-Location backend-python
          .\.venv\Scripts\python.exe -m pytest -q --cov=main --cov=data_processor --cov-report=term-missing --cov-report="json:$backendJson" --cov-report="html:$backendHtml"
          Pop-Location
          Push-Location Data-driven-modeling
          $env:COVERAGE_DIR = "$root\.acceptance\frontend-coverage"
          npm run test:coverage
          Pop-Location
          & "$root\backend-python\.venv\Scripts\python.exe" "$root\scripts\measure-acceptance.py"

  ubuntu:
    name: verify (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装后端依赖
        working-directory: backend-python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt -r requirements-dev.txt

      - name: 安装前端依赖
        working-directory: Data-driven-modeling
        run: npm ci --registry=https://registry.npmmirror.com

      - name: 跑两套测试（verify.sh）
        run: sh verify.sh

      - name: 前端 lint
        working-directory: Data-driven-modeling
        run: npm run lint

      - name: 前端构建
        working-directory: Data-driven-modeling
        run: npm run build

      - name: 确认 Cesium 静态资源进了产物
        working-directory: Data-driven-modeling
        run: |
          count=$(find dist/Cesium -type f | wc -l)
          echo "dist/Cesium files: $count"
          if [ "$count" -ne 380 ]; then echo "dist/Cesium 文件数应为 380，实际 $count"; exit 1; fi

      # 验收度量：覆盖率 + API 延迟 + 产物体积，一次跑完并打印对照验收线的表格。
      #
      # continue-on-error：这一轮是「先看得见」，不是「变成红灯」。
      # 度量脚本本身恒定返回 0（未达标的项在输出里逐条列出），
      # 这里再兜一层底，是为了让覆盖率工具万一在某个平台上炸掉时也不阻塞 CI。
      - name: 验收度量（报告，不阻塞）
        continue-on-error: true
        run: |
          set -u
          ROOT="$PWD"
          mkdir -p .acceptance
          export COVERAGE_FILE="$ROOT/.acceptance/.coverage-backend"
          ( cd backend-python && .venv/bin/python -m pytest -q --cov=main --cov=data_processor --cov-report=term-missing --cov-report="json:$ROOT/.acceptance/backend-coverage.json" --cov-report="html:$ROOT/.acceptance/backend-htmlcov" )
          ( cd Data-driven-modeling && COVERAGE_DIR="$ROOT/.acceptance/frontend-coverage" npm run test:coverage )
          backend-python/.venv/bin/python scripts/measure-acceptance.py
